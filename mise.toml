# The machine this repo expects, and the dotfiles it installs. install.sh runs
# `mise bootstrap` over it, which applies these in order: the oh-my-zsh clone, then
# the dotfiles below, then the macOS preferences at the end.
#
# No packages phase. Every Homebrew package is in the Brewfile at the repo root,
# which install.sh applies with `brew bundle`: mise's bootstrap has no
# --no-upgrade, nothing to assert an installed set against, and no way to fetch a
# formula from a plain tap. mise's job here is the language runtimes.

# The runtime this repository needs for itself: the compiled tools under their own
# folders at the root — hachiko so far — are built with it. A runtime every project
# may want a different version of is in home/.config/mise/config.toml instead, and
# another project's go or rust stays in that project's own mise.toml.
#
# Only a rebuild depends on this. Each tool's wrapper in ~/.local/bin runs a binary
# it has already built, so a LaunchAgent keeps working when mise does not.
#
# The mise.lock beside this file is what `mise install --locked` reads, so a rebuilt
# Mac gets the version resolved here rather than whatever latest means on the day.
[tools]
go = "1.27"

# oh-my-zsh's own installer does nothing here that a clone does not: it is only
# told not to run zsh, not to chsh, and not to write a .zshrc, all of which this
# repo owns.
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# The dotfiles this repo installs. Declared here rather than in the global
# config because a source path relative to the config file is only allowed in a
# project one, and every source below is a path inside this checkout.
#
# install.sh applies them; the shapes are the same ones it used to symlink by
# hand, directories included.

[dotfiles]
"~/.bashrc" = { source = "home/.bashrc", mode = "symlink" }
"~/.gitconfig" = { source = "home/.gitconfig", mode = "symlink" }
"~/.zprofile" = { source = "home/.zprofile", mode = "symlink" }
"~/.zshenv" = { source = "home/.zshenv", mode = "symlink" }
"~/.zshrc" = { source = "home/.zshrc", mode = "symlink" }

"~/.config/boswell/config.toml" = { source = "home/.config/boswell/config.toml", mode = "symlink" }
"~/.config/ccstatusline/settings.json" = { source = "home/.config/ccstatusline/settings.json", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "home/.config/herdr/config.toml", mode = "symlink" }
"~/.config/git/worktree-install" = { source = "home/.config/git/worktree-install", mode = "symlink" }
"~/.config/starship.toml" = { source = "home/.config/starship.toml", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "home/.config/mise/mise.lock", mode = "symlink" }
"~/.config/mise/locks" = { source = "home/.config/mise/locks", mode = "symlink" }
"~/.terminfo/x/xterm-ghostty" = { source = "home/.terminfo/x/xterm-ghostty", mode = "symlink" }
# macOS's ncurses hashes the first letter rather than using it, so it looks the
# entry up under 78, which is the link that does the work. The `x` spelling is
# linked too, at no cost, so anything expecting the conventional layout finds it.
"~/.terminfo/78/xterm-ghostty" = { source = "home/.terminfo/x/xterm-ghostty", mode = "symlink" }

# Linked like everything above it: launchd resolves the link at bootstrap, and the
# plist leaves every path it needs to a shell that expands $HOME for itself.
# install.sh is what loads it, and only once ~/projects/docs is a clone: boswell refuses a
# config naming a path that is not a work tree.
"~/Library/LaunchAgents/io.github.timche.boswell.plist" = { source = "home/Library/LaunchAgents/io.github.timche.boswell.plist", mode = "symlink" }
"~/Library/LaunchAgents/io.github.timche.herdr.plist" = { source = "home/Library/LaunchAgents/io.github.timche.herdr.plist", mode = "symlink" }

# The sweep that follows a removed worktree, and the one plist still rendered rather
# than linked: launchd reads WatchPaths itself and expands no $HOME in it, so that
# path has to arrive already absolute. It runs `hachiko gc`, so the wrapper below is
# the whole of what it needs installed.
"~/Library/LaunchAgents/io.github.timche.hachiko-gc.plist" = { source = "home/Library/LaunchAgents/io.github.timche.hachiko-gc.plist", mode = "template" }

# The watch over free space and the CPU, with the webhook reference beside it: the
# wrapper resolves its .env.op from its own directory, so the two are linked together
# or the alert has nowhere to go. The wrapper is all that is linked — the binary it
# builds from hachiko/ lives in ~/Library/Caches/hachiko and is nobody's dotfile.
"~/.local/bin/hachiko" = { source = "home/.local/bin/hachiko", mode = "symlink" }
"~/.local/bin/hachiko.env.op" = { source = "home/.local/bin/hachiko.env.op", mode = "symlink" }
"~/.config/hachiko/cpu-allow" = { source = "home/.config/hachiko/cpu-allow", mode = "symlink" }

# Answering the on-call session from Discord, off until the config file names a channel and
# a user. The two secrets it needs are in a second .env.op rather than beside the webhook,
# because `op run` refuses a reference it cannot resolve and a bot token named before the
# field exists would take every alert down with it.
"~/.local/bin/hachiko.discord.env.op" = { source = "home/.local/bin/hachiko.discord.env.op", mode = "symlink" }
"~/.config/hachiko/discord" = { source = "home/.config/hachiko/discord", mode = "symlink" }

# Where hachiko checks in, which is the half of the watch that is not on this Mac. The URL
# alone: the ping token goes in ~/.config/hachiko/shibuya-token, which shibuya/secrets.sh
# generates on the Mac and nothing here links, because it is the one secret this repository
# makes rather than references.
"~/.config/hachiko/shibuya" = { source = "home/.config/hachiko/shibuya", mode = "symlink" }

# `hachiko sync`, which commits and pushes the repositories its config lists. A plain
# symlink like the agents above it, since it needs no WatchPaths: it polls `git status`
# itself rather than being woken by a write. install.sh is what loads it, and only once
# ~/projects/docs is a clone, since sync refuses a config naming a path that is not a
# work tree.
"~/.config/hachiko/sync" = { source = "home/.config/hachiko/sync", mode = "symlink" }
"~/Library/LaunchAgents/io.github.timche.hachiko-sync.plist" = { source = "home/Library/LaunchAgents/io.github.timche.hachiko-sync.plist", mode = "symlink" }

# `screencapture -l` of one app's window, by owner name rather than window id.
"~/.local/bin/window-shot" = { source = "home/.local/bin/window-shot", mode = "symlink" }

# Ahead of Homebrew's op on PATH, so a project's `op run` is signed in with the
# service-account token without the project knowing how.
"~/.local/bin/op" = { source = "home/.local/bin/op", mode = "symlink" }

"~/Library/LaunchAgents/io.github.timche.hachiko.plist" = { source = "home/Library/LaunchAgents/io.github.timche.hachiko.plist", mode = "symlink" }
"~/Library/LaunchAgents/io.github.timche.hachiko-listen.plist" = { source = "home/Library/LaunchAgents/io.github.timche.hachiko-listen.plist", mode = "symlink" }
"~/.config/betterleaks/betterleaks.toml" = { source = "home/.config/betterleaks/betterleaks.toml", mode = "symlink" }

"~/.claude/CLAUDE.md" = { source = "home/.claude/CLAUDE.md", mode = "symlink" }
"~/.claude/settings.json" = { source = "home/.claude/settings.json", mode = "symlink" }
"~/.claude/agents" = { source = "home/.claude/agents", mode = "symlink" }
"~/.claude/hooks" = { source = "home/.claude/hooks", mode = "symlink" }
"~/.claude/skills" = { source = "home/.claude/skills", mode = "symlink" }

# Tim's preferences, the half of them that is a plain user default.
#
# The rest of them are in install.sh, each for a reason mise states outright: a
# system domain written with sudo is not supported here, a value holding the home
# directory cannot be written because these values are not templated, an empty
# Dock has to happen once rather than on every bootstrap, and mise deliberately
# restarts no application, while a `post-defaults` hook would restart one on
# every run whether or not a preference changed.

# One friendly key writes both Clicking domains — the built-in trackpad's and the
# Bluetooth one's, which is the Magic Trackpad this Mac mini actually has.
[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
# FXEnableExtensionChangeWarning, inverted by the friendly name: false is the
# warning gone.
show_extensions_warning = false

# The one Finder preference with no friendly key, and it is global rather than
# Finder's own.
[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true }

# The one that actually does anything on macOS 26 — per machine rather than per
# account, which is what `defaults -currentHost` means and what the shorthand
# table above cannot say, so it takes an explicit entry. The two Clicking domains
# look to be a mirror System Settings keeps rather than what the input stack
# reads: forcing them to 0 and this to 1 still taps to click. They are written
# anyway, being what System Settings shows and free to set.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1
