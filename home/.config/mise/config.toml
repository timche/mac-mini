[settings]
lockfile = true

# Language runtimes, and the npm packages that run on the node beside them.
# Every other CLI tool is Homebrew's, in the Brewfile at the repo root; mise and
# Claude Code come from their authors' own installers. CLAUDE.md has the rule.
[tools]
bun = "latest"
node = "lts"
python = "latest"
# Installed once rather than fetched per draw: npx paid for npm starting node twice
# on every status line.
"npm:ccstatusline" = "latest"
# mise's npm backend rather than Homebrew's formula, which would bring a second node
# of its own. portless's README asks for a global install, and this is one: the
# package lands in mise's install directory instead of inside whichever node is
# current, so a node upgrade does not take it along.
"npm:portless" = "latest"
# The browser every Claude Code session drives and inspects, registered by
# install.sh as a user-scope MCP server. Installed rather than `npx -y …@latest`
# for the same reason as ccstatusline, and so the lockfile says which version runs.
"npm:chrome-devtools-mcp" = "latest"
# The Chrome that server launches: Google's build of current stable for
# automation, an app of its own because macOS sends a launch of Tim's Chrome to a
# copy already running under its bundle ID, and a headless copy opens no window.
# No cask and no updater of its own, so mise follows the stable channel's version
# list and the nightly `mise up` moves it.
"http:chrome-for-testing" = { version = "latest", version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json", version_json_path = ".channels.Stable.version", platforms = { macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-mac-arm64.zip", bin_path = "chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS" } } }
