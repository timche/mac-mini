name: secrets

# The second line behind the pre-commit hook in home/.gitconfig: that hook guards
# commits made on the Mac and can be skipped with --no-verify, while this reads
# every commit that reaches GitHub, whichever way it came. Betterleaks publishes
# no action of its own, so it runs from its image, pinned so a new release's rules
# are adopted on purpose, with the same config the hook uses. The checkout belongs
# to the runner's user and the container runs as root, which git inside refuses as
# dubious ownership unless the mounted repository is declared safe.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/betterleaks/betterleaks:v1.8.1
          git /repo --redact --no-banner --verbose
          --config /repo/home/.config/betterleaks/betterleaks.toml
