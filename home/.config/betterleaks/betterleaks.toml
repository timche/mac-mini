# The config the pre-commit hook in .gitconfig scans with, in every repository on
# this Mac: Betterleaks' own rules, minus two kinds of value that look like
# passwords and are not.
#
# An op:// reference names where a secret lives in 1Password; the value only
# exists once `op run` or `op read` resolves it, so a file of references is safe
# to commit and is how every secret here is wired. `stub-` values are test
# doubles, such as the ones assert.sh hands to tart-runner in place of a token.
filter = '''
filter.matchesAny(finding["secret"], [`^op://`]) ||
filter.matchesAny(finding["secret"], [`^stub-`])
'''

# Keys after a table header belong to that table, so the filter has to come first.
[extend]
useDefault = true

