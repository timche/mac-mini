# This machine's own logs, capped by the newsyslog macOS already runs every half
# hour from com.apple.newsyslog — so these two need nothing to call them and no
# sudo at all once this file is in place. `claude-root rotate-logs` is the same
# thing on demand.
#
# Only the logs a rename is safe for are here. hachiko's check and the worktree
# sweep are launchd jobs started afresh every few minutes, so each run opens the
# path and finds the file newsyslog left. The machine's other logs — boswell, the
# herdr server, hachiko's listener, the signing agent — are written by processes
# that redirect their whole output once and hold the descriptor for their life,
# and renaming one of those leaves the writer appending to the archive while the
# file at the path stays empty forever. claude-root copies those aside and
# truncates them in place instead.
#
# owner:group is the account's rather than newsyslog's root:admin default,
# because the replacement file newsyslog creates has to be one the writer can
# still append to.
#
# The home directory and the account name below are rendered in at install time by
# root-helper.sh: newsyslog expands neither a ~ nor a $HOME, and nothing in this
# repository is written for one account name. A placeholder that survived the
# rendering is a file the installer refuses to move into place.
#
# N — there is no daemon to signal; neither of these is syslogd's. No compression
# flag: bzip2 and gzip both unlink the file they compressed, and an unlinked file
# a writer still holds gives its space back only when that writer exits.
#
# logfilename  [owner:group]  mode  count  size  when  flags
__HOME__/Library/Logs/hachiko.log  __USER__:staff  644  5  10240  *  N
__HOME__/Library/Logs/worktree-gc.log  __USER__:staff  644  5  10240  *  N
