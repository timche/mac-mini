name: test

# On GitHub's hosted macOS runners, which are free to a public repository — and
# being free to this one is why it is public. A private repository's macOS
# minutes count tenfold against the free allowance, and every change here lands on
# main as it is made.
#
# The paths filter is for the same reason: only a change the suite can catch
# starts a run, and a burst of them ends as one.
on:
  push:
    paths: &code
      - "*.sh"
      - Brewfile
      - mise.toml
      - tools/**
      - account/**
      - machine/**
      - test/**
      - .github/**
      - home/**
      - "!home/**/*.md"
      - "!home/.claude/skills/**"
  pull_request:
    paths: *code
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # On the runner itself rather than in a container: there is no macOS container
  # to put any of this in, and the suite changes the machine it runs on. The
  # runner's account is called `runner`, which is what proves nothing here is
  # written for the one Mac it is aimed at — and it arrives with Homebrew and
  # passwordless sudo, so what is exercised is the second run of every step as
  # much as the first.
  #
  # Nothing is logged in and there is no service account, which is the state every
  # fresh Mac is in: every step that needs one has to skip rather than fail. The
  # docs clone fails for want of a token, so `hachiko sync` stays unloaded and
  # sync-agent.sh is what proves its wiring against launchd instead.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The fresh-Mac path first, which is the only one that clones: the
      # repository under test stands in for GitHub, so what runs is this branch
      # rather than main. It ends with $HOME linked into that clone, which the
      # steps below then move back to the workspace, the way a Mac re-run in place
      # does.
      - name: bootstrap.sh from a clone of this branch
        env:
          MAC_MINI_REPO: ${{ github.workspace }}
          MAC_MINI_DIR: ${{ runner.temp }}/mac-mini
        run: ./bootstrap.sh
      - run: ${{ runner.temp }}/mac-mini/test/assert-machine.sh
      - run: ${{ runner.temp }}/mac-mini/test/assert.sh

      # Then each phase by hand, twice and asserted after each: the repeat is what
      # keeps the whole of it honest about being safe to re-run, which is the only
      # way a change ever reaches a Mac that is already built.
      - run: ./machine.sh
      - run: test/assert-machine.sh
      - run: ./machine.sh
      - run: test/assert-machine.sh

      # The root helper's privileged half, which only a machine with passwordless
      # sudo can exercise — a runner is exactly that, and it is also why the
      # assert there cannot check that sudo refuses everything else.
      #
      # --list and the refusals rather than either action. A runner has SIP
      # disabled, so a restart-daemon kickstart succeeds there where a real Mac
      # may refuse it, which is the opposite of the case the fallback exists for,
      # and bouncing the scheduler of the VM this job runs in buys nothing either
      # way; flush-dns would leave the job's own resolver cold for no information.
      # What is worth asserting as root is that the path runs at all and that the
      # refusals happen on that side of sudo too.
      - name: the root helper under sudo
        run: |
          sudo -n /usr/local/libexec/claude-root --list
          ! sudo -n /usr/local/libexec/claude-root restart-daemon not-on-the-list
          ! sudo -n /usr/local/libexec/claude-root rotate-logs
          ! sudo -n /usr/local/libexec/claude-root rm

      # Xcode itself, which machine.sh leaves to a run that has a terminal to type
      # an Apple ID at, so the workflow is what calls it here. A runner arrives
      # with several Xcodes already, which is the half this can exercise: select
      # one, accept the licence, finish the first launch, and reach for no
      # download. Twice, for the same reason as above.
      - run: ./machine/xcode.sh
      - run: ./machine/xcode.sh
      - run: test/assert-machine.sh

      # The account phase, which starts with install.sh — so the bare install.sh
      # after it is the second pass over that half.
      - run: ./claude.sh
      - run: test/assert-account.sh
      - run: test/assert.sh
      - run: ./install.sh
      - run: test/assert.sh

      # The compiled tools, whose behaviour is their own tests rather than the assert
      # scripts': those check the wiring, and `go test` checks what a sweep decides.
      # On the go this repo's own mise.toml declares and install.sh has just put there,
      # through its absolute path because a workflow step reads no rc file.
      #
      # -C names the checkout rather than trusting the working directory, because mise
      # decides which tools are active from the directory it is asked about and a go that
      # is not active reads as a go that is not installed.
      # One pass per module, like the govulncheck below it: what a tool decides is its own
      # tests, and lib/discord is a module of its own with tests of its own. Two modules want
      # more than `./...`, each for the reason its wrapper in home/.local/bin/ wants it — the
      # client is where the goroutines are, and mochi is built against it through a replace,
      # so mochi's gate runs those packages as mochi resolves them.
      - name: go vet and go test in every Go module under tools/
        run: |
          mise="$HOME/.local/bin/mise"
          repo="$GITHUB_WORKSPACE"
          gotest() {
            m="$1"
            shift
            "$mise" exec -C "$repo" -- go test -C "$repo/tools/$m" "$@"
          }
          for module in hachiko lib/discord mochi claude-hooks; do
            "$mise" exec -C "$repo" -- go vet -C "$repo/tools/$module" ./...
            case "$module" in
              lib/discord) gotest "$module" -race ./... ;;
              mochi) gotest "$module" ./... github.com/timche/mac-mini/discord/... ;;
              *) gotest "$module" ./... ;;
            esac
            test -z "$("$mise" exec -C "$repo" -- gofmt -l "$repo/tools/$module")"
          done

      # The Swift tool's own tests, on the Xcode machine/xcode.sh selected above, which is
      # the toolchain build-tool builds it with on the Mac.
      - name: swift test in tools/window/
        run: swift test --package-path "$GITHUB_WORKSPACE/tools/window"

      # Known vulnerabilities in what each Go module builds with: the standard library of the
      # go mise installed, and any module a tool may one day pin. Run at a pinned version
      # rather than required, since it is a tool of CI's and no dependency of theirs.
      - name: govulncheck in every Go module under tools/
        run: |
          mise="$HOME/.local/bin/mise"
          repo="$GITHUB_WORKSPACE"
          for module in hachiko lib/discord mochi claude-hooks; do
            "$mise" exec -C "$repo" -- go run -C "$repo/tools/$module" golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          done

      # shibuya, which needs no Mac: the tests run in workerd and would be happier on
      # ubuntu. They are here anyway, because this is the job that has mise's node — the
      # one every project on the Mac uses — and a second job would mean a second way to
      # install node and a second place saying which version. Nothing in a run calls
      # deploy.sh, which is what runs these before a real deploy, so without this step a
      # broken Worker would land green.
      #
      # `tsc --noEmit` is in `npm test` as well as vitest: a Durable Object's whole
      # interface is a type, and the pool cannot run what does not compile.
      - name: npm test in tools/shibuya/
        run: |
          mise="$HOME/.local/bin/mise"
          repo="$GITHUB_WORKSPACE"
          node="$("$mise" which -C "$repo" node)"
          PATH="$(dirname "$node"):$PATH"
          export PATH
          cd "$repo/tools/shibuya"
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/shibuya-dry"

      # The signing key, with a stub op standing in for 1Password. The one thing
      # here that cannot be checked without a vault.
      - run: test/signing-key.sh

      # The sync agent as launchd loads it, under a label of its own. A runner has
      # a gui domain, which is the one thing this cannot do without.
      - run: test/sync-agent.sh

      # machine.sh left the sshd drop-in out for want of a key to log in with,
      # which is the refusal that keeps a Mac nobody can walk up to reachable.
      # Seed a key the way a real one has and it should land. Last, because a
      # runner has nothing after this that needs to log in.
      - name: harden-ssh.sh with a key installed
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C ci -f /tmp/ci
          install -m 600 /tmp/ci.pub ~/.ssh/authorized_keys
          ./machine/harden-ssh.sh
      - run: test/assert-machine.sh
